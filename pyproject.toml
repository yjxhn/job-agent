[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_core*"]

[project]
name = "agent-core"
version = "0.1.0"
description = "独立的 LLM 驱动求职 AI Agent 系统"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.28,<1.0",
    "openai>=2.0,<3.0",
    "python-docx>=1.0",
    "websockets>=12.0",
    "playwright>=1.40",  # zhilian/boss persistent-browser modes (tests mock it; CI needs library only)

]

[project.scripts]
job-agent = "agent_core.cli:app"

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
]
dev = [
    "black>=25",
    "ruff>=0.11",
    "mypy>=1.15",
    "bandit>=1.8",
]

[tool.pytest.ini_options]
markers = [
    "integration: integration test that requires real backend (e.g. Windows Toast)",
]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"agent_core/pipeline/match.py" = ["E501"]  # LLM prompt templates have long JSON lines
"agent_core/pipeline/interview_prep.py" = ["E501"]  # long LLM prompt/rule strings
"agent_core/pipeline/offer_eval.py" = ["E501"]  # long LLM prompt strings
"agent_core/agent/tools.py" = ["E501"]  # tool schema long lines
"agent_core/agent/repl.py" = ["E501"]  # help text long lines
"agent_core/pipeline/orchestrator.py" = ["E501"]
"tests/test_materials.py" = ["E501"]
"tests/test_serve_more.py" = ["E501"]
"tests/test_serve_handlers2.py" = ["E501"]
"tests/test_realtime_proxy_more.py" = ["E501"]
"tests/test_orchestrator_more.py" = ["E501"]
"tests/test_providers_more.py" = ["E501"]
"agent_core/platforms/boss_browser.py" = ["E501"]
"agent_core/server/realtime_proxy.py" = ["E501"]  # binary protocol + long log lines

[tool.ruff.lint.isort]
known-first-party = ["agent_core"]

[tool.bandit]
# NOTE: bandit's pyproject reader ignores `configfile = ...`, so skips must be
# inlined here (not redirected to .bandit.yaml) for `bandit -c pyproject.toml`
# (the CI invocation) to actually apply them.
skips = ["B101", "B110", "B608", "B112"]  # B101 assert in tests; B110 try-except-pass; B608 parameterized SQL false positives; B112 try-except-continue in platform scraping
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["agent_core"]
branch = true
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
precision = 1
skip_empty = true
fail_under = 70  # 2026-08-18 实测 84.4%（补齐 serve/realtime/browser/CLI/orchestrator 等测试后达标 70）

[tool.mypy]
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "agent_core.*"
disallow_untyped_defs = false
follow_imports = "normal"
