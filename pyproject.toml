[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_core*"]

[project]
name = "agent-core"
version = "0.1.0"
description = "独立的 LLM 驱动求职 AI Agent 系统"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.28",
    "openai>=1.0",
    "python-docx>=1.0",
    "playwright>=1.50",
]

[project.scripts]
job-agent = "agent_core.cli:app"

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
]
dev = [
    "black>=25",
    "ruff>=0.11",
    "mypy>=1.15",
    "bandit>=1.8",
]

[tool.pytest.ini_options]
markers = [
    "integration: integration test that requires real backend (e.g. Windows Toast)",
]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["agent_core"]

[tool.bandit]
# NOTE: bandit's pyproject reader ignores `configfile = ...`, so skips must be
# inlined here (not redirected to .bandit.yaml) for `bandit -c pyproject.toml`
# (the CI invocation) to actually apply them.
skips = ["B101", "B110"]  # B101 assert in tests; B110 try-except-pass in scraping fallbacks
exclude_dirs = ["tests"]

[tool.coverage.run]
source = ["agent_core"]
branch = true
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
precision = 1
skip_empty = true
fail_under = 68

[tool.mypy]
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "agent_core.*"
disallow_untyped_defs = false
follow_imports = "normal"
