name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: Lint with ruff
        run: python -m ruff check agent_core

      - name: Type check with mypy
        run: python -m mypy agent_core --ignore-missing-imports

      - name: Security scan with bandit
        run: python -m bandit -r agent_core -c pyproject.toml

      - name: LLM provider naming check
        run: python scripts/check_llm_naming.py

      - name: Run tests with coverage
        env:
          DEEPSEEK_API_KEY: dummy-key  # tests read config.api_key (env-backed); any non-empty value works
        run: |
          mkdir -p resumes && echo "test resume" > resumes/example_resume.txt
          python -m pytest -q --cov=agent_core --cov-report=term --cov-report=xml --cov-fail-under=70
